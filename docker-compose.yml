services:
  backend:
    build:
      context: ./backend
    container_name: backend-node-board
    ports:
      - "${BACKEND_PORT}:8001"
    restart: unless-stopped
    environment:
      DB_HOST: ${DB_HOST}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      BACKEND_PORT: ${BACKEND_PORT}
      DB_PORT: ${DB_PORT}
    depends_on:
      - mysql

  mysql:
    image: mysql:8
    container_name: mysql-board
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    ports:
      - "${DB_PORT}:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
