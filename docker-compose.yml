services:
  backend:
    build:
      context: ./backend
    container_name: board-backend
    restart: unless-stopped
    environment:
      DB_HOST: ${DB_HOST}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_PORT: ${DB_PORT}
      BACKEND_PORT: ${BACKEND_PORT}
    depends_on:
      - mysql
    networks:
      - proxy
      - internal

  mysql:
    image: mysql:8
    container_name: board-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - internal

volumes:
  mysql_data:
networks:
  proxy:
    external: true
  internal:
    external: true
